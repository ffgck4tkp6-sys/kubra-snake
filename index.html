<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kubra Snake</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#323232;color:#fff;font-family:system-ui,sans-serif}.game{position:relative}.game canvas{display:block;width:min(100vw,800px);height:auto;image-rendering:pixelated}#overlay{position:absolute;inset:0;display:none;place-content:center;text-align:center;background:#323232}#overlay.show{display:grid}#overlay strong{font-size:clamp(2rem,8vw,4rem)}button{font:inherit;font-weight:800;color:#fff;background:#323232;border:1px solid #fff;padding:.7em 1.2em;cursor:pointer}.help{text-align:center}.controls{display:grid;grid-template-columns:repeat(3,62px);grid-template-rows:repeat(2,54px);justify-content:center;gap:7px;margin:20px auto}.controls button{padding:0;font-size:1.4rem}.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}@media(min-width:700px){.controls{display:none}}
</style>
</head>
<body>
<main>
<section class="game">
<canvas id="game" width="800" height="600"></canvas>
<div id="overlay"><strong>GAME OVER</strong><button id="restart">Tekrar oyna</button></div>
</section>
<p class="help">Ok tuşları veya WASD ile oyna.</p>
<div class="controls"><button class="up" data-d="up">↑</button><button class="left" data-d="left">←</button><button class="down" data-d="down">↓</button><button class="right" data-d="right">→</button></div>
</main>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay');
const size=5,cols=160,rows=120;
let snake,direction,queuedDirection,food,speed,timer,gameOver,wallHitTime,turnQueued;
function reset(){snake=[{x:76,y:56},{x:75,y:56},{x:74,y:56}];direction={x:1,y:0};queuedDirection={x:1,y:0};food={x:40,y:40};speed=100;gameOver=false;wallHitTime=0;turnQueued=false;overlay.classList.remove('show');if(timer)clearInterval(timer);timer=setInterval(step,speed);draw()}
function chooseDirection(next){
 if(gameOver||turnQueued)return;
 // Only one 90-degree turn is accepted between movement ticks.
 // This prevents a rapid Up->Left/Down sequence from reversing into the body.
 if(next.x===-direction.x&&next.y===-direction.y)return;
 if(next.x===direction.x&&next.y===direction.y)return;
 queuedDirection={...next};turnQueued=true;
}
function randomFood(){let f;do f={x:Math.floor(Math.random()*cols),y:Math.floor(Math.random()*rows)};while(snake.some(p=>p.x===f.x&&p.y===f.y));return f}
function step(){if(gameOver)return;direction={...queuedDirection};turnQueued=false;const head={x:snake[0].x+direction.x,y:snake[0].y+direction.y};const hitWall=head.x<0||head.x>=cols||head.y<0||head.y>=rows;if(hitWall){if(!wallHitTime)wallHitTime=Date.now();else if(Date.now()-wallHitTime>=200)endGame();return}wallHitTime=0;if(snake.slice(0,-1).some(p=>p.x===head.x&&p.y===head.y)){endGame();return}snake.unshift(head);if(head.x===food.x&&head.y===food.y){snake.push({...snake[snake.length-1]});food=randomFood();if(speed>25){speed-=10;clearInterval(timer);timer=setInterval(step,speed)}}else snake.pop();draw()}
function endGame(){gameOver=true;clearInterval(timer);overlay.classList.add('show');draw()}
function draw(){ctx.fillStyle='#323232';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#ff0000';ctx.fillRect(food.x*size,food.y*size,size,size);snake.forEach((p,i)=>{ctx.fillStyle=i===0?'#00ff00':'#ffffff';ctx.fillRect(p.x*size,p.y*size,size,size)})}
const keys={ArrowUp:{x:0,y:-1},w:{x:0,y:-1},ArrowDown:{x:0,y:1},s:{x:0,y:1},ArrowLeft:{x:-1,y:0},a:{x:-1,y:0},ArrowRight:{x:1,y:0},d:{x:1,y:0}};
addEventListener('keydown',e=>{if(keys[e.key]){e.preventDefault();chooseDirection(keys[e.key])}});
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>chooseDirection({up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}[b.dataset.d]));
document.getElementById('restart').onclick=reset;
reset();
</script>
</body>
</html>
