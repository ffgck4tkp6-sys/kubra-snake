<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#323232">
  <title>Kubra Snake</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #323232; color: #fff; font-family: system-ui, sans-serif; }
    main { width: min(100vw, 800px); }
    .game { position: relative; overflow: hidden; background: #323232; }
    canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; }
    #overlay { position: absolute; inset: 0; display: none; place-content: center; text-align: center; background: #323232; }
    #overlay.show { display: grid; }
    #overlay strong { font-size: clamp(2rem, 8vw, 4rem); color: #fff; }
    button { font: inherit; font-weight: 800; color: #fff; background: #323232; border: 1px solid #fff; padding: .72em 1.2em; cursor: pointer; }
    .help { margin: 12px 4px 0; color: #fff; text-align: center; font-size: .95rem; }
    .controls { display: grid; grid-template-columns: repeat(3, 62px); grid-template-rows: repeat(2, 54px); justify-content: center; gap: 7px; margin: 22px auto 0; }
    .controls button { padding: 0; border-radius: 13px; font-size: 1.4rem; }
    .controls .up { grid-column: 2; }
    .controls .left { grid-column: 1; grid-row: 2; }
    .controls .down { grid-column: 2; grid-row: 2; }
    .controls .right { grid-column: 3; grid-row: 2; }
    @media (min-width: 700px) { .controls { display: none; } }
  </style>
</head>
<body>
  <main>
    <section class="game" aria-label="Snake oyunu">
      <canvas id="game" width="800" height="600" aria-label="Yılan oyunu"></canvas>
      <div id="overlay" role="status" aria-live="polite"><strong>GAME OVER</strong><button id="restart">Tekrar oyna</button></div>
    </section>
    <p class="help">Ok tuşları veya WASD ile oyna. Yılan doğrudan ters yöne dönemez.</p>
    <div class="controls" aria-label="Dokunmatik kontroller">
      <button class="up" data-direction="up" aria-label="Yukarı">↑</button>
      <button class="left" data-direction="left" aria-label="Sol">←</button>
      <button class="down" data-direction="down" aria-label="Aşağı">↓</button>
      <button class="right" data-direction="right" aria-label="Sağ">→</button>
    </div>
  </main>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');

    // C sürümündekiyle aynı 5 px hareket/grid mantığı.
    const size = 5;
    const cols = 160;
    const rows = 120;

    let snake = [];
    let direction = { x: 1, y: 0 };
    let queuedDirection = { x: 1, y: 0 };
    let food = { x: 40, y: 40 };
    let speed = 100;
    let timer = null;
    let gameOver = false;
    let wallHitStarted = 0;

    function randomFood() {
      let candidate;
      do {
        candidate = {
          x: Math.floor(Math.random() * cols),
          y: Math.floor(Math.random() * rows)
        };
      } while (snake.some(part => part.x === candidate.x && part.y === candidate.y));
      return candidate;
    }

    function reset() {
      snake = [
        { x: 76, y: 56 },
        { x: 75, y: 56 },
        { x: 74, y: 56 }
      ];
      direction = { x: 1, y: 0 };
      queuedDirection = { x: 1, y: 0 };
      food = { x: 40, y: 40 };
      speed = 100;
      gameOver = false;
      wallHitStarted = 0;

      overlay.classList.remove('show');
      if (timer !== null) clearInterval(timer);
      timer = setInterval(step, speed);
      draw();
    }

    function chooseDirection(next) {
      if (gameOver) return;
      if (next.x === -queuedDirection.x && next.y === -queuedDirection.y) return;
      queuedDirection = { x: next.x, y: next.y };
    }

    function step() {
      if (gameOver) return;

      direction = { x: queuedDirection.x, y: queuedDirection.y };
      const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
      };

      const hitWall = head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows;
      if (hitWall) {
        if (wallHitStarted === 0) wallHitStarted = Date.now();
        else if (Date.now() - wallHitStarted >= 200) endGame();
        return;
      }
      wallHitStarted = 0;

      const hitSelf = snake.some((part, index) =>
        index > 0 && part.x === head.x && part.y === head.y
      );
      if (hitSelf) {
        endGame();
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        food = randomFood();
        if (speed > 25) {
          speed -= 10;
          clearInterval(timer);
          timer = setInterval(step, speed);
        }
      } else {
        snake.pop();
      }

      draw();
    }

    function endGame() {
      gameOver = true;
      if (timer !== null) clearInterval(timer);
      overlay.classList.add('show');
      draw();
    }

    function draw() {
      ctx.fillStyle = '#323232';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#00ff00';
      ctx.fillRect(snake[0].x * size, snake[0].y * size, size, size);

      ctx.fillStyle = '#ffffff';
      for (let i = 1; i < snake.length; i++) {
        ctx.fillRect(snake[i].x * size, snake[i].y * size, size, size);
      }

      ctx.fillStyle = '#ff0000';
      ctx.fillRect(food.x * size, food.y * size, size, size);
    }

    const keys = {
      ArrowUp: { x: 0, y: -1 },
      w: { x: 0, y: -1 },
      ArrowDown: { x: 0, y: 1 },
      s: { x: 0, y: 1 },
      ArrowLeft: { x: -1, y: 0 },
      a: { x: -1, y: 0 },
      ArrowRight: { x: 1, y: 0 },
      d: { x: 1, y: 0 }
    };

    addEventListener('keydown', event => {
      const next = keys[event.key];
      if (next) {
        event.preventDefault();
        chooseDirection(next);
      }
    });

    document.querySelectorAll('[data-direction]').forEach(button => {
      button.addEventListener('click', () => {
        const directions = {
          up: { x: 0, y: -1 },
          down: { x: 0, y: 1 },
          left: { x: -1, y: 0 },
          right: { x: 1, y: 0 }
        };
        chooseDirection(directions[button.dataset.direction]);
      });
    });

    document.getElementById('restart').addEventListener('click', reset);

    // Oyunu başlangıçta kesin olarak çalışan durumda başlat.
    reset();
  </script>
</body>
</html>
