<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Kubra Snake</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#323232}body{display:flex;flex-direction:column;align-items:center;padding:12px 0}.game{position:relative;width:min(320px,100vw);height:min(480px,calc(100vw * 1.5));border:3px solid #fff;overflow:hidden}.game canvas{display:block;width:100%;height:100%;image-rendering:pixelated}.controls{position:fixed!important;left:50%!important;bottom:max(18px,env(safe-area-inset-bottom))!important;transform:translateX(-50%)!important;display:grid!important;grid-template-columns:64px 64px 64px;grid-template-rows:64px 64px;gap:8px;visibility:visible!important;opacity:1!important;z-index:99999!important}.controls button{width:64px;height:64px;background:#555;color:#fff;border:2px solid #fff;border-radius:10px;font-size:30px;font-weight:bold;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-appearance:none;appearance:none;display:flex;align-items:center;justify-content:center}.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}.retry{display:none;position:absolute;left:50%;top:245px;transform:translateX(-50%);width:120px;height:48px;background:#555;color:#fff;border:2px solid #fff;border-radius:8px;font-size:17px;font-weight:bold;z-index:5}.retry.show{display:block}</style></head><body><div class="game"><canvas id="game" width="320" height="480"></canvas><button id="retry" class="retry">Tekrar Oyna</button></div><div class="controls"><button class="up" data-d="up">↑</button><button class="left" data-d="left">←</button><button class="down" data-d="down">↓</button><button class="right" data-d="right">→</button></div><script>(function(){const c=document.getElementById('game'),x=c.getContext('2d'),retry=document.getElementById('retry'),cell=8,cols=40,rows=60,speed=100;let snake,dir,next,food,timer,over;const dirs={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};function reset(){clearInterval(timer);snake=[{x:19,y:30},{x:18,y:30},{x:17,y:30}];dir=null;next=null;food={x:10,y:10};timer=null;over=false;retry.classList.remove('show');draw()}function draw(){x.fillStyle='#323232';x.fillRect(0,0,320,480);x.fillStyle='#f00';x.fillRect(food.x*cell,food.y*cell,cell,cell);for(let i=snake.length-1;i>=0;i--){x.fillStyle=i?'#fff':'#0f0';x.fillRect(snake[i].x*cell,snake[i].y*cell,cell,cell)}if(over){x.fillStyle='rgba(0,0,0,.65)';x.fillRect(0,0,320,480);x.fillStyle='#fff';x.textAlign='center';x.font='bold 30px Arial';x.fillText('GAME OVER',160,220);retry.classList.add('show')}}function setDir(d){if(over)return;if(dir&&d.x===-dir.x&&d.y===-dir.y)return;next=d;if(!dir){dir=d;timer=setInterval(step,speed)}}function step(){if(over||!dir)return;if(next&&!(next.x===-dir.x&&next.y===-dir.y))dir=next;next=null;let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.x>=cols||h.y<0||h.y>=rows||snake.some(p=>p.x===h.x&&p.y===h.y)){over=true;clearInterval(timer);timer=null;draw();return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){let f;do{f={x:Math.floor(Math.random()*cols),y:Math.floor(Math.random()*rows)}}while(snake.some(p=>p.x===f.x&&p.y===f.y));food=f}else snake.pop();draw()}document.addEventListener('keydown',e=>{const k={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'}[e.key];if(k){e.preventDefault();setDir(dirs[k])}});document.querySelectorAll('.controls button').forEach(b=>{const go=e=>{e.preventDefault();setDir(dirs[b.dataset.d])};b.addEventListener('pointerdown',go);b.addEventListener('touchstart',go,{passive:false})});retry.addEventListener('click',reset);retry.addEventListener('touchend',e=>{e.preventDefault();reset()},{passive:false});reset()})()</script></body></html>
