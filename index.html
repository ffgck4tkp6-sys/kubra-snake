<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kubra Snake</title><style>html,body{margin:0;min-height:100%;background:#323232}body{display:flex;flex-direction:column;align-items:center;padding:12px;box-sizing:border-box}.game{position:relative;width:min(640px,calc(100vw - 24px));aspect-ratio:4/3;box-sizing:border-box;border:3px solid #fff;display:grid;place-items:center}.game canvas{width:400px;height:300px;display:block;image-rendering:pixelated}.controls{display:grid;grid-template-columns:58px 58px 58px;grid-template-rows:58px 58px;gap:6px;margin-top:14px}.controls button{width:58px;height:58px;background:#555;color:#fff;border:2px solid #fff;border-radius:10px;font-size:28px;font-weight:bold;touch-action:manipulation}.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}@media(min-width:701px){.controls{display:none}}</style></head><body><div class="game"><canvas id="game" width="400" height="300"></canvas></div><div class="controls"><button class="up" data-d="up">↑</button><button class="left" data-d="left">←</button><button class="down" data-d="down">↓</button><button class="right" data-d="right">→</button></div><script>(function(){const c=document.getElementById('game'),x=c.getContext('2d'),cell=3,cols=133,rows=100,speed=100;let snake,dir,next,food,timer,over;const dirs={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};function reset(){clearInterval(timer);snake=[{x:66,y:49},{x:65,y:49},{x:64,y:49}];dir=null;next=null;food={x:33,y:33};timer=null;over=false;draw()}function draw(){x.fillStyle='#323232';x.fillRect(0,0,400,300);x.fillStyle='#f00';x.fillRect(food.x*cell,food.y*cell,cell,cell);for(let i=snake.length-1;i>=0;i--){x.fillStyle=i?'#fff':'#0f0';x.fillRect(snake[i].x*cell,snake[i].y*cell,cell,cell)}if(over){x.fillStyle='rgba(0,0,0,.65)';x.fillRect(0,0,400,300);x.fillStyle='#fff';x.textAlign='center';x.font='bold 30px Arial';x.fillText('GAME OVER',200,140);x.font='16px Arial';x.fillText('Tekrar oyna: R',200,170)}}function setDir(d){if(over)return;if(dir&&d.x===-dir.x&&d.y===-dir.y)return;next=d;if(!dir){dir=d;timer=setInterval(step,speed)}}function step(){if(over||!dir)return;if(next&&!(next.x===-dir.x&&next.y===-dir.y))dir=next;next=null;let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.x>=cols||h.y<0||h.y>=rows||snake.some(p=>p.x===h.x&&p.y===h.y)){over=true;clearInterval(timer);timer=null;draw();return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){let f;do{f={x:Math.floor(Math.random()*cols),y:Math.floor(Math.random()*rows)}}while(snake.some(p=>p.x===f.x&&p.y===f.y));food=f}else snake.pop();draw()}document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='r'&&over)return reset();const k={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'}[e.key];if(k){e.preventDefault();setDir(dirs[k])}});document.querySelectorAll('.controls button').forEach(b=>{const go=e=>{e.preventDefault();setDir(dirs[b.dataset.d])};b.addEventListener('pointerdown',go);b.addEventListener('touchstart',go,{passive:false})});reset()})()</script></body></html>
