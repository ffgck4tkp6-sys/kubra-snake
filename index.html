<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kubra Snake</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#323232}.game{position:relative;width:640px;height:480px;border:3px solid #fff}.game canvas{display:block;width:640px;height:480px}#overlay{position:absolute;inset:0;display:none;place-items:center;background:#323232}#overlay.show{display:grid}#overlay div{text-align:center;font-family:system-ui,sans-serif;color:#fff;font-size:32px;font-weight:800}#restart{display:block;margin:18px auto 0;padding:8px 16px;font-size:16px;cursor:pointer}</style></head><body><div class="game"><canvas id="game" width="640" height="480"></canvas><div id="overlay"><div>GAME OVER<button id="restart">Tekrar oyna</button></div></div></div><script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay');const cell=5,cols=128,rows=96,speed=100;let snake,direction,nextDirection,food,timer,gameOver;function reset(){if(timer)clearInterval(timer);snake=[{x:63,y:47},{x:62,y:47},{x:61,y:47}];direction=null;nextDirection=null;food={x:20,y:20};gameOver=false;overlay.classList.remove('show');draw()}function setDirection(d){if(gameOver)return;if(direction&&d.x===-direction.x&&d.y===-direction.y)return;nextDirection=d;if(direction===null){direction=d;timer=setInterval(step,speed)}}function newFood(){let f;do f={x:Math.floor(Math.random()*cols),y:Math.floor(Math.random()*rows)}while(snake.some(p=>p.x===f.x&&p.y===f.y));return f}function step(){if(gameOver||direction===null)return;if(nextDirection&&!(nextDirection.x===-direction.x&&nextDirection.y===-direction.y))direction=nextDirection;nextDirection=null;const head={x:snake[0].x+direction.x,y:snake[0].y+direction.y};if(head.x<0||head.x>=cols||head.y<0||head.y>=rows){endGame();return}if(snake.some(p=>p.x===head.x&&p.y===head.y)){endGame();return}snake.unshift(head);if(head.x===food.x&&head.y===food.y)food=newFood();else snake.pop();draw()}function endGame(){gameOver=true;if(timer)clearInterval(timer);timer=null;overlay.classList.add('show')}function draw(){ctx.fillStyle='#323232';ctx.fillRect(0,0,640,480);ctx.fillStyle='#ff0000';ctx.fillRect(food.x*cell,food.y*cell,cell,cell);snake.forEach((p,i)=>{ctx.fillStyle=i===0?'#00ff00':'#fff';ctx.fillRect(p.x*cell,p.y*cell,cell,cell)})}const keys={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},w:{x:0,y:-1},s:{x:0,y:1},a:{x:-1,y:0},d:{x:1,y:0}};addEventListener('keydown',e=>{if(keys[e.key]){e.preventDefault();setDirection(keys[e.key])}});document.getElementById('restart').onclick=reset;reset();</script></body></html>
