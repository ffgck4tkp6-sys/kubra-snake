<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07120d">
  <title>Kubra Snake</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #323232; color: #fff; font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; }
    main { width: min(100vw, 800px); padding: 0; }
    header { display: none; }
    h1 { margin: 0; font-size: clamp(1.7rem, 6vw, 2.8rem); letter-spacing: -0.06em; }
    #score { font-size: 1.05rem; font-weight: 800; color: #a9ffbd; white-space: nowrap; }
    .game { position: relative; overflow: hidden; background: #323232; }
    canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; }
    #overlay { position: absolute; inset: 0; display: grid; place-content: center; gap: 10px; text-align: center; background: #323232dd; opacity: 0; pointer-events: none; transition: opacity .15s ease; }
    #overlay.show { opacity: 1; pointer-events: auto; }
    #overlay strong { font-size: clamp(2rem, 8vw, 4rem); color: #fff; letter-spacing: -0.07em; }
    #overlay span { color: #fff; }
    button { font: inherit; font-weight: 800; color: #fff; background: #323232; border: 1px solid #fff; border-radius: 0; padding: .72em 1.2em; cursor: pointer; }
    button:active { transform: translateY(1px); }
    .help { margin: 12px 4px 0; color: #fff; text-align: center; font-size: .95rem; }
    .controls { display: grid; grid-template-columns: repeat(3, 62px); grid-template-rows: repeat(2, 54px); justify-content: center; gap: 7px; margin: 22px auto 0; }
    .controls button { padding: 0; border-radius: 13px; font-size: 1.4rem; }
    .controls .up { grid-column: 2; }
    .controls .left { grid-column: 1; grid-row: 2; }
    .controls .down { grid-column: 2; grid-row: 2; }
    .controls .right { grid-column: 3; grid-row: 2; }
    @media (min-width: 700px) { .controls { display: none; } }
  </style>
</head>
<body>
  <main>
    <section class="game" aria-label="Snake oyunu">
      <canvas id="game" width="800" height="600" aria-label="Yılan oyunu"></canvas>
      <div id="overlay" role="status" aria-live="polite"><strong>Game Over</strong><button id="restart">Tekrar oyna</button></div>
    </section>
    <p class="help">Ok tuşları veya WASD ile oyna. Yılan doğrudan ters yöne dönemez.</p>
    <div class="controls" aria-label="Dokunmatik kontroller">
      <button class="up" data-direction="up" aria-label="Yukarı">↑</button>
      <button class="left" data-direction="left" aria-label="Sol">←</button>
      <button class="down" data-direction="down" aria-label="Aşağı">↓</button>
      <button class="right" data-direction="right" aria-label="Sağ">→</button>
    </div>
  </main>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const size = 20, cols = canvas.width / size, rows = canvas.height / size;
    let snake, direction, queuedDirection, food, speed, timer, gameOver, wallHitStarted;

    function randomFood() {
      let candidate;
      do candidate = { x: Math.floor(Math.random() * cols), y: Math.floor(Math.random() * rows) };
      while (snake.some(part => part.x === candidate.x && part.y === candidate.y));
      return candidate;
    }
    function reset() {
      snake = [{ x: 76, y: 56 }, { x: 75, y: 56 }, { x: 74, y: 56 }];
      direction = { x: 1, y: 0 };
      queuedDirection = direction;
      food = { x: 40, y: 40 }; speed = 100; gameOver = false; wallHitStarted = 0;
      overlay.classList.remove('show');
      clearInterval(timer); timer = setInterval(step, speed); draw();
    }
    function sameDirection(a, b) { return a.x === b.x && a.y === b.y; }
    function chooseDirection(next) {
      if (gameOver || sameDirection(next, queuedDirection) || (next.x === -queuedDirection.x && next.y === -queuedDirection.y)) return;
      queuedDirection = next;
    }
    function step() {
      direction = queuedDirection;
      const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
      const hitWall = head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows;
      const hitSelf = snake.slice(0, -1).some(part => part.x === head.x && part.y === head.y);
      if (hitWall) {
        if (!wallHitStarted) wallHitStarted = Date.now();
        else if (Date.now() - wallHitStarted >= 200) endGame();
        return;
      }
      wallHitStarted = 0;
      if (hitSelf) { endGame(); return; }
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        food = randomFood();
        if (speed > 25) speed -= 10;
        clearInterval(timer); timer = setInterval(step, speed);
      } else snake.pop();
      draw();
    }
    function endGame() { gameOver = true; clearInterval(timer); overlay.classList.add('show'); draw(); }
    function draw() {
      ctx.fillStyle = '#323232'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ff0000'; ctx.fillRect(food.x * size, food.y * size, size, size);
      snake.forEach((part, index) => { ctx.fillStyle = index === 0 ? '#00ff00' : '#ffffff'; ctx.fillRect(part.x * size, part.y * size, size, size); });
    }
    const keys = { ArrowUp: {x:0,y:-1}, w:{x:0,y:-1}, ArrowDown:{x:0,y:1}, s:{x:0,y:1}, ArrowLeft:{x:-1,y:0}, a:{x:-1,y:0}, ArrowRight:{x:1,y:0}, d:{x:1,y:0} };
    addEventListener('keydown', event => { const next = keys[event.key]; if (next) { event.preventDefault(); chooseDirection(next); } });
    document.querySelectorAll('[data-direction]').forEach(button => button.addEventListener('click', () => chooseDirection({ up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0} }[button.dataset.direction])));
    document.getElementById('restart').addEventListener('click', reset);
    reset();
  </script>
</body>
</html>
