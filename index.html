<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kubra Snake</title>
<style>
html,body{margin:0;min-height:100%;background:#323232}
body{display:grid;place-items:center;padding:12px;box-sizing:border-box}
.game{position:relative;width:min(640px,calc(100vw - 24px));aspect-ratio:4/3;box-sizing:border-box;border:3px solid #fff;overflow:visible;display:grid;place-items:center}
.game canvas{display:block;width:400px;height:300px;image-rendering:pixelated;background:#323232}
.controls{display:grid;position:absolute;top:calc(100% + 14px);left:50%;transform:translateX(-50%);grid-template-columns:52px 52px 52px;grid-template-rows:52px 52px;gap:7px;z-index:5}
.controls button{width:52px;height:52px;border:2px solid #fff;background:#555;color:#fff;font-size:25px;font-weight:bold;border-radius:9px;touch-action:manipulation;-webkit-user-select:none;user-select:none;display:flex;align-items:center;justify-content:center}
.controls .up{grid-column:2}.controls .left{grid-column:1;grid-row:2}.controls .down{grid-column:2;grid-row:2}.controls .right{grid-column:3;grid-row:2}
@media (min-width:701px){.controls{display:none}}
</style>
</head>
<body>
<div class="game">
<canvas id="game" width="400" height="300"></canvas>
<div class="controls" aria-label="Yön tuşları">
<button type="button" class="up" data-dir="up">↑</button><button type="button" class="left" data-dir="left">←</button><button type="button" class="down" data-dir="down">↓</button><button type="button" class="right" data-dir="right">→</button>
</div>
</div>
<script>
(function(){
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const cell=3,cols=133,rows=100,speed=100;
let snake,direction,nextDirection,food,timer,gameOver;
function reset(){if(timer)clearInterval(timer);snake=[{x:66,y:49},{x:65,y:49},{x:64,y:49}];direction=null;nextDirection=null;food={x:33,y:33};timer=null;gameOver=false;draw()}
function draw(){ctx.fillStyle='#323232';ctx.fillRect(0,0,400,300);ctx.fillStyle='#ff0000';ctx.fillRect(food.x*cell,food.y*cell,cell,cell);for(let i=snake.length-1;i>=0;i--){ctx.fillStyle=i===0?'#00ff00':'#fff';ctx.fillRect(snake[i].x*cell,snake[i].y*cell,cell,cell)}if(gameOver){ctx.fillStyle='rgba(0,0,0,0.65)';ctx.fillRect(0,0,400,300);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 30px Arial';ctx.fillText('GAME OVER',200,140);ctx.font='16px Arial';ctx.fillText('Tekrar oyna: R',200,170)}}
function newFood(){let f;do{f={x:Math.floor(Math.random()*cols),y:Math.floor(Math.random()*rows)}}while(snake.some(p=>p.x===f.x&&p.y===f.y));return f}
function endGame(){gameOver=true;if(timer)clearInterval(timer);timer=null;draw()}
function step(){if(gameOver||!direction)return;if(nextDirection&&!(nextDirection.x===-direction.x&&nextDirection.y===-direction.y))direction=nextDirection;nextDirection=null;const head={x:snake[0].x+direction.x,y:snake[0].y+direction.y};if(head.x<0||head.x>=cols||head.y<0||head.y>=rows||snake.some(p=>p.x===head.x&&p.y===head.y)){endGame();return}snake.unshift(head);if(head.x===food.x&&head.y===food.y)food=newFood();else snake.pop();draw()}
function setDirection(d){if(gameOver)return;if(direction&&d.x===-direction.x&&d.y===-direction.y)return;nextDirection=d;if(direction===null){direction=d;timer=setInterval(step,speed)}}
const dirs={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
const keys={ArrowUp:dirs.up,ArrowDown:dirs.down,ArrowLeft:dirs.left,ArrowRight:dirs.right,w:dirs.up,s:dirs.down,a:dirs.left,d:dirs.right};
window.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='r'&&gameOver){reset();return}if(keys[e.key]){e.preventDefault();setDirection(keys[e.key])}});
document.querySelectorAll('.controls button').forEach(b=>{const go=()=>setDirection(dirs[b.dataset.dir]);b.addEventListener('pointerdown',e=>{e.preventDefault();go()});b.addEventListener('touchstart',e=>{e.preventDefault();go()},{passive:false});});
reset();
})();
</script>
</body>
</html>
