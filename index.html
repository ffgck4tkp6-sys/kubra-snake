<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kubra Snake</title>
<style>
html,body{margin:0;min-height:100%;background:#323232}
body{display:grid;place-items:center;padding:12px;box-sizing:border-box}
.game{position:relative;width:min(640px,calc(100vw - 24px));aspect-ratio:4/3;box-sizing:border-box;border:3px solid #fff;overflow:hidden}
.game canvas{display:block;width:100%;height:100%;image-rendering:pixelated;background:#323232}
#gameover{position:absolute;inset:0;display:none;place-items:center;background:rgba(0,0,0,.55);font-family:Arial,sans-serif;text-align:center;color:#fff}
#gameover .box{font-size:28px;font-weight:700}
#gameover button{margin-top:12px;padding:8px 16px;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<div class="game">
<canvas id="game" width="400" height="300"></canvas>
<div id="gameover"><div class="box">GAME OVER<br><button id="restart">Tekrar oyna</button></div></div>
</div>
<script>
(function(){
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('gameover'),restart=document.getElementById('restart');
const cell=5,cols=80,rows=60,speed=100;
let snake,direction,nextDirection,food,timer,gameOver;
function reset(){if(timer)clearInterval(timer);snake=[{x:39,y:29},{x:38,y:29},{x:37,y:29}];direction=null;nextDirection=null;food={x:20,y:20};timer=null;gameOver=false;overlay.style.display='none';draw()}
function draw(){ctx.fillStyle='#323232';ctx.fillRect(0,0,400,300);ctx.fillStyle='#ff0000';ctx.fillRect(food.x*cell,food.y*cell,cell,cell);for(let i=snake.length-1;i>=0;i--){ctx.fillStyle=i===0?'#00ff00':'#fff';ctx.fillRect(snake[i].x*cell,snake[i].y*cell,cell,cell)}}
function newFood(){let f;do{f={x:Math.floor(Math.random()*cols),y:Math.floor(Math.random()*rows)}}while(snake.some(p=>p.x===f.x&&p.y===f.y));return f}
function endGame(){gameOver=true;if(timer)clearInterval(timer);timer=null;overlay.style.display='grid'}
function step(){if(gameOver||!direction)return;if(nextDirection&&!(nextDirection.x===-direction.x&&nextDirection.y===-direction.y))direction=nextDirection;nextDirection=null;const head={x:snake[0].x+direction.x,y:snake[0].y+direction.y};if(head.x<0||head.x>=cols||head.y<0||head.y>=rows||snake.some(p=>p.x===head.x&&p.y===head.y)){endGame();return}snake.unshift(head);if(head.x===food.x&&head.y===food.y)food=newFood();else snake.pop();draw()}
function setDirection(d){if(gameOver)return;if(direction&&d.x===-direction.x&&d.y===-direction.y)return;nextDirection=d;if(direction===null){direction=d;timer=setInterval(step,speed)}}
const keys={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},w:{x:0,y:-1},s:{x:0,y:1},a:{x:-1,y:0},d:{x:1,y:0}};
window.addEventListener('keydown',e=>{if(keys[e.key]){e.preventDefault();setDirection(keys[e.key])}});restart.addEventListener('click',reset);reset();
})();
</script>
</body>
</html>
