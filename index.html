<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kubra Snake</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#323232}
.game{position:relative;width:640px;height:480px;border:3px solid #fff}
canvas{display:block;width:640px;height:480px}
#overlay{position:absolute;inset:0;display:none;place-items:center;background:#323232}
#overlay.show{display:grid}
#overlay div{text-align:center;font-family:system-ui,sans-serif;color:#fff;font-size:32px;font-weight:800}
#restart{display:block;margin:18px auto 0;padding:8px 16px;font-size:16px;cursor:pointer}
@media(max-width:650px){.game{width:calc(100vw - 20px);height:auto}.game canvas{width:100%;height:auto}}
</style>
</head>
<body>
<div class="game">
<canvas id="game" width="640" height="480"></canvas>
<div id="overlay"><div>GAME OVER<button id="restart">Tekrar oyna</button></div></div>
</div>
<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const overlay=document.getElementById('overlay');
const cell=16;
const cols=40;
const rows=30;
const speed=100;
let snake=[];
let direction=null;
let nextDirection=null;
let food=null;
let timer=null;
let gameOver=false;

function reset(){
  if(timer!==null) clearInterval(timer);
  snake=[{x:19,y:14},{x:18,y:14},{x:17,y:14}];
  direction=null;
  nextDirection=null;
  food={x:10,y:10};
  gameOver=false;
  overlay.classList.remove('show');
  draw();
}

function setDirection(newDirection){
  if(gameOver) return;
  if(direction!==null && newDirection.x===-direction.x && newDirection.y===-direction.y) return;
  nextDirection=newDirection;
  if(direction===null){
    direction=newDirection;
    timer=setInterval(step,speed);
  }
}

function newFood(){
  let candidate;
  do{
    candidate={x:Math.floor(Math.random()*cols),y:Math.floor(Math.random()*rows)};
  }while(snake.some(p=>p.x===candidate.x && p.y===candidate.y));
  return candidate;
}

function step(){
  if(gameOver || direction===null) return;
  if(nextDirection!==null && !(nextDirection.x===-direction.x && nextDirection.y===-direction.y)) direction=nextDirection;
  nextDirection=null;

  const head={x:snake[0].x+direction.x,y:snake[0].y+direction.y};
  if(head.x<0 || head.x>=cols || head.y<0 || head.y>=rows){ endGame(); return; }
  if(snake.some(p=>p.x===head.x && p.y===head.y)){ endGame(); return; }

  snake.unshift(head);
  if(head.x===food.x && head.y===food.y) food=newFood();
  else snake.pop();
  draw();
}

function endGame(){
  gameOver=true;
  if(timer!==null) clearInterval(timer);
  timer=null;
  overlay.classList.add('show');
}

function draw(){
  ctx.fillStyle='#323232';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle='#ff0000';
  ctx.fillRect(food.x*cell,food.y*cell,cell,cell);

  snake.forEach((part,index)=>{
    ctx.fillStyle=index===0?'#00ff00':'#ffffff';
    ctx.fillRect(part.x*cell,part.y*cell,cell,cell);
  });
}

const keys={
  ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},
  w:{x:0,y:-1},s:{x:0,y:1},a:{x:-1,y:0},d:{x:1,y:0}
};

window.addEventListener('keydown',event=>{
  const newDirection=keys[event.key];
  if(newDirection){event.preventDefault();setDirection(newDirection);}
});

document.getElementById('restart').addEventListener('click',reset);
reset();
</script>
</body>
</html>
