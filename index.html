<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kubra Snake</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#323232}.game{position:relative;width:640px;border:3px solid #fff;line-height:0}.game canvas{display:block;width:640px;height:480px;image-rendering:pixelated}#overlay{position:absolute;inset:3px;display:none;place-items:center;background:#323232}#overlay.show{display:grid}#overlay div{text-align:center;font-family:system-ui,sans-serif;color:#fff;font-size:32px;font-weight:800}#restart{display:block;margin:18px auto 0;padding:8px 16px;font:inherit;font-size:16px;cursor:pointer}@media(max-width:650px){.game{width:calc(100vw - 20px)}.game canvas{width:100%;height:auto}}
</style>
</head>
<body>
<div class="game">
<canvas id="game" width="400" height="300"></canvas>
<div id="overlay"><div>GAME OVER<button id="restart">Tekrar oyna</button></div></div>
</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay');
const size=10,cols=40,rows=30,tick=100;
let snake,direction,nextDirection,food,timer,gameOver,started;
function reset(){if(timer)clearInterval(timer);snake=[{x:19,y:14},{x:18,y:14},{x:17,y:14}];direction=null;nextDirection=null;food={x:10,y:10};gameOver=false;started=false;overlay.classList.remove('show');draw()}
function setDirection(d){if(gameOver)return;if(direction&&d.x===-direction.x&&d.y===-direction.y)return;nextDirection=d;if(!started){started=true;direction=d;timer=setInterval(step,tick)}}
function randomFood(){let f;do f={x:Math.floor(Math.random()*cols),y:Math.floor(Math.random()*rows)}while(snake.some(p=>p.x===f.x&&p.y===f.y));return f}
function step(){if(gameOver||!direction)return;if(nextDirection&&!(nextDirection.x===-direction.x&&nextDirection.y===-direction.y))direction=nextDirection;nextDirection=null;const head={x:snake[0].x+direction.x,y:snake[0].y+direction.y};if(head.x<0||head.x>=cols||head.y<0||head.y>=rows){endGame();return}if(snake.some(p=>p.x===head.x&&p.y===head.y)){endGame();return}snake.unshift(head);if(head.x===food.x&&head.y===food.y)food=randomFood();else snake.pop();draw()}
function endGame(){gameOver=true;if(timer)clearInterval(timer);overlay.classList.add('show')}
function draw(){ctx.fillStyle='#323232';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#ff0000';ctx.fillRect(food.x*size,food.y*size,size,size);snake.forEach((p,i)=>{ctx.fillStyle=i===0?'#00ff00':'#fff';ctx.fillRect(p.x*size,p.y*size,size,size)})}
const keys={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},w:{x:0,y:-1},s:{x:0,y:1},a:{x:-1,y:0},d:{x:1,y:0}};addEventListener('keydown',e=>{if(keys[e.key]){e.preventDefault();setDirection(keys[e.key])}});document.getElementById('restart').onclick=reset;reset();
</script>
</body>
</html>
